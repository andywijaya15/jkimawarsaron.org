name: Build & Deploy ke Git Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'deploy-hostinger'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Astro & Push ke branch deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test || echo "Skip test if dist not generated yet"

      - name: Build Astro Static Site
        run: npm run build

      - name: Verify Build Artifacts
        run: npm test

      - name: Push static build ke branch deploy
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy
          git add -A
          git commit -m "deploy: static build from commit ${GITHUB_SHA::8}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
