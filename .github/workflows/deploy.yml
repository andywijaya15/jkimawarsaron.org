name: Build & Deploy ke Git Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'deploy-hostinger'
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Astro & Push ke branch deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test || echo "Skip test if dist not generated yet"

      - name: Build Astro Static Site
        run: npm run build

      - name: Verify Build Artifacts
        run: npm test

      - name: Push static build ke branch deploy
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy
          git add -A
          git commit -m "deploy: static build from commit ${GITHUB_SHA::8}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Trigger Auto Git Pull di Hostinger via Webhook
        run: |
          echo "Memanggil Webhook auto-pull di Hostinger..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN || 'jkims_deploy_9f2a71d8e4c3b5' }}" \
            "https://jkimawarsaron.org/deploy-webhook.php")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          echo "Status: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"
