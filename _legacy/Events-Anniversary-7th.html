    body {

    #video-container {
      max-width: 800px;
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      margin-top: 50px;
    }

    p {
      text-align: center;
      font-weight: bold;
    }

    video {
      width: 100%;
      height: auto;
    }

    .youtube-video {
      position: relative;
      padding-bottom: 56.25%;
      /* Untuk mempertahankan aspek rasio video 16:9 */
      overflow: hidden;
      max-width: 800px;
      margin: 20px auto;
    }

    .youtube-video iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .arrow-down {
      text-align: center;
      margin-top: 20px;
    }

    .arrow-down:before {
      content: "\2193";
      /* Karakter Unicode untuk tanda panah ke bawah */
      font-size: 24px;
    }
  </style>
